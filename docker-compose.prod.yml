name: sorrel

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/marijusar/sorrel-backend:latest}
  env_file: .env
  restart: unless-stopped
  networks:
    - sorrel-network
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    container_name: sorrel-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sorrel-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sorrel-rabbitmq
    # Mnesia writes to /var/lib/rabbitmq/mnesia/rabbit@$HOSTNAME. Without a
    # pinned hostname a recreated container boots a new, empty node and
    # orphans the old directory on the volume, so durable queues look wiped.
    hostname: sorrel-rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # management UI stays on the loopback only — reach it via
      # `ssh -L 15672:localhost:15672 <host>`, never exposed through traefik.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sorrel-network

  backend:
    <<: *backend
    container_name: sorrel-backend
    command: ["node", "dist/index.js"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/_api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      # Traefik's default rule-length priority should already favor this
      # PathPrefix rule over the frontend's plain Host(...) rule, but pin it
      # explicitly so /_api/* can never fall through to the frontend.
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/_api"
      - "traefik.http.routers.backend.middlewares=api-stripprefix"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  backend-worker-homepage:
    <<: *backend
    container_name: sorrel-backend-worker-homepage
    command: ["node", "dist/workers/homepage-worker.js"]

  backend-worker-technology-events:
    <<: *backend
    container_name: sorrel-backend-worker-technology-events
    command: ["node", "dist/workers/technology-event-worker.js"]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/marijusar/sorrel-frontend:latest}
    container_name: sorrel-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8080
      API_URL: https://${DOMAIN}/_api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    networks:
      - sorrel-network

  traefik:
    image: traefik:v3.3
    container_name: sorrel-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - sorrel-network

volumes:
  postgres-data:
  rabbitmq-data:
  letsencrypt-data:

networks:
  sorrel-network:
    driver: bridge
