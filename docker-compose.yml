services:
  postgres:
    image: postgres:18-alpine
    container_name: sorrel-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sorrel_dev
    volumes:
      - postgres-data-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sorrel-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sorrel-rabbitmq-dev
    # Mnesia writes to /var/lib/rabbitmq/mnesia/rabbit@$HOSTNAME. Without a
    # pinned hostname a recreated container boots a new, empty node and
    # orphans the old directory, so durable queues look wiped.
    hostname: sorrel-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sorrel
      RABBITMQ_DEFAULT_PASS: sorrel
    volumes:
      - rabbitmq-data-dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sorrel-network

  backend:
    image: node:26-alpine
    container_name: sorrel-backend-dev
    working_dir: /workspace
    command: sh -c "npm install -g pnpm@10.5.2 && pnpm --filter backend dev"
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sorrel_dev
      PORT: "8080"
      JWT_SECRET: dev-only-secret-change-me-32-plus-characters
      ACCESS_TOKEN_TTL_MS: "900000"
      REFRESH_TOKEN_TTL_MS: "2592000000"
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
      FRONTEND_URL: http://localhost:3000
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET intentionally not set here —
      # sourced from apps/backend/.env (gitignored) via --env-file-if-exists.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sorrel-network

  backend-worker-homepage:
    image: node:26-alpine
    container_name: sorrel-backend-worker-homepage-dev
    working_dir: /workspace
    command: sh -c "npm install -g pnpm@10.5.2 && pnpm --filter backend worker:homepage"
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sorrel_dev
      RABBITMQ_URL: amqp://sorrel:sorrel@rabbitmq:5672
      HOMEPAGE_WORKER_CONCURRENCY: "5"
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sorrel-network

  backend-worker-technology-events:
    image: node:26-alpine
    container_name: sorrel-backend-worker-technology-events-dev
    working_dir: /workspace
    command: sh -c "npm install -g pnpm@10.5.2 && pnpm --filter backend worker:technology-events"
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sorrel_dev
      RABBITMQ_URL: amqp://sorrel:sorrel@rabbitmq:5672
      TECHNOLOGY_EVENT_WORKER_CONCURRENCY: "5"
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sorrel-network

  frontend:
    image: node:26-alpine
    container_name: sorrel-frontend-dev
    working_dir: /workspace
    command: sh -c "npm install -g pnpm@10.5.2 && pnpm --filter frontend dev"
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: http://localhost:8090
      INTERNAL_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - sorrel-network

volumes:
  postgres-data-dev:
  rabbitmq-data-dev:

networks:
  sorrel-network:
    driver: bridge
